<!doctype html>
<meta charset="utf-8">
<title>OAuth MCP test</title>
<body style="font:14px monospace;max-width:900px;margin:20px auto">
<h3>OAuth 2.1 + MCP test</h3>
<label>MCP URL <input id="mcp" size="70" value="https://mcp.prompteye.com/mcp"></label>
<p>
<button onclick="run(connect)">Connect</button>
<button onclick="run(refresh)">Refresh token</button>
<button onclick="run(callMcp)">Call MCP</button>
<button onclick="run(reset)">Reset</button>
</p>
<pre id="log" style="background:#f4f4f4;padding:8px;white-space:pre-wrap;word-break:break-all"></pre>
<script>
const $ = id => document.getElementById(id);
const REDIRECT = location.origin + location.pathname;
const S = { get: k => sessionStorage.getItem(k), set: (k, v) => sessionStorage.setItem(k, v) };
const log = (m, ok) => { $('log').textContent += `[${new Date().toISOString().slice(11, 23)}] ${ok === true ? '✓' : ok === false ? '✗' : ' '} ${m}\n`; };
const mask = t => t ? t.slice(0, 12) + '…' : '(none)';
const pick = (o, ks) => JSON.stringify(Object.fromEntries(ks.map(k => [k, o[k]])));
const mcpUrl = () => $('mcp').value.trim();
const run = async f => { try { await f(); } catch (e) { log('exception: ' + e, false); } };

async function req(label, url, opts) {
  const r = await fetch(url, opts);
  const text = await r.text();
  if (!r.ok) { log(`${label}: HTTP ${r.status} ${text}`, false); throw new Error(label + ' failed'); }
  return { r, text, json: () => JSON.parse(text) };
}
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

async function connect() {
  const u = new URL(mcpUrl());
  const prm = (await req('protected-resource', `${u.origin}/.well-known/oauth-protected-resource${u.pathname}`)).json();
  log(`protected-resource: resource=${prm.resource} as=${prm.authorization_servers?.[0]}`, true);
  const issuer = prm.authorization_servers[0].replace(/\/$/, '');
  const as = (await req('as-metadata', `${issuer}/.well-known/oauth-authorization-server`)).json();
  log(`as-metadata: ${pick(as, ['authorization_endpoint', 'token_endpoint', 'registration_endpoint', 'client_id_metadata_document_supported', 'code_challenge_methods_supported'])}`, true);
  const reg = (await req('DCR', as.registration_endpoint, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ client_name: 'PromptEye OAuth test', redirect_uris: [REDIRECT], token_endpoint_auth_method: 'none', grant_types: ['authorization_code', 'refresh_token'], response_types: ['code'] }),
  })).json();
  log(`DCR: client_id=${reg.client_id}`, true);
  const verifier = rand(48), state = rand(16);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  S.set('st', JSON.stringify({ verifier, state, client_id: reg.client_id, token_endpoint: as.token_endpoint, resource: mcpUrl() }));
  const a = new URL(as.authorization_endpoint);
  Object.entries({ response_type: 'code', client_id: reg.client_id, redirect_uri: REDIRECT, code_challenge: challenge, code_challenge_method: 'S256', state, resource: mcpUrl(), scope: 'api_access' })
    .forEach(([k, v]) => a.searchParams.set(k, v));
  log('redirecting to ' + a);
  setTimeout(() => location.href = a, 300);
}

async function tokenReq(label, params) {
  const st = JSON.parse(S.get('st'));
  const t = (await req(label, st.token_endpoint, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ ...params, client_id: st.client_id, resource: st.resource }),
  })).json();
  log(`${label}: token_type=${t.token_type} expires_in=${t.expires_in} scope=${t.scope} has_refresh_token=${!!t.refresh_token} access=${mask(t.access_token)} refresh=${mask(t.refresh_token)}`, true);
  return t;
}

async function refresh() {
  const old = S.get('refresh');
  if (!old) return log('no refresh token stored', false);
  const t = await tokenReq('refresh', { grant_type: 'refresh_token', refresh_token: old });
  S.set('access', t.access_token);
  if (t.refresh_token) { S.set('refresh', t.refresh_token); log(`rotation: ${t.refresh_token !== old ? 'refresh token CHANGED' : 'refresh token SAME (no rotation)'}`, t.refresh_token !== old); }
}

async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', REDIRECT);
  if (q.has('error')) return log(`authorize error: ${q.get('error')} ${q.get('error_description') || ''}`, false);
  const st = JSON.parse(S.get('st') || '{}');
  if (q.get('state') !== st.state) return log('state mismatch', false);
  log('authorize: code received, state OK', true);
  const t = await tokenReq('token', { grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: st.verifier });
  S.set('access', t.access_token); S.set('refresh', t.refresh_token || '');
}

const parse = text => {
  const line = text.split('\n').find(l => l.startsWith('data:'));
  return JSON.parse(line ? line.slice(5).trim() : text);
};
const H = (tok, sid) => ({ ...(tok && { Authorization: 'Bearer ' + tok }), 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', ...(sid && { 'mcp-session-id': sid }) });

async function callMcp() {
  const url = mcpUrl(), tok = S.get('access');
  const r0 = await fetch(url, { method: 'POST', headers: H(), body: JSON.stringify({ jsonrpc: '2.0', id: 0, method: 'tools/list' }) });
  log(`unauthenticated POST: HTTP ${r0.status} WWW-Authenticate=${r0.headers.get('www-authenticate') || '(unreadable/absent cross-origin)'}`, r0.status === 401);
  if (!tok) return log('no access token; Connect first', false);
  const post = async (label, body, sid) => {
    const x = await req(label, url, { method: 'POST', headers: H(tok, sid), body: JSON.stringify(body) });
    return { sid: x.r.headers.get('mcp-session-id'), msg: x.text.trim() ? parse(x.text) : null };
  };
  const init = await post('initialize', { jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'oauth-test', version: '0' } } });
  log(`initialize: server=${JSON.stringify(init.msg?.result?.serverInfo)} session=${init.sid}`, !!init.msg?.result);
  await post('initialized', { jsonrpc: '2.0', method: 'notifications/initialized' }, init.sid);
  log('notifications/initialized sent', true);
  const tl = await post('tools/list', { jsonrpc: '2.0', id: 2, method: 'tools/list' }, init.sid);
  const tools = tl.msg?.result?.tools || [];
  log(`tools/list: ${tools.length} tools, first 5: ${tools.slice(0, 5).map(t => t.name).join(', ')}`, tools.length > 0);
}

function reset() { sessionStorage.clear(); $('log').textContent = ''; log('sessionStorage cleared'); }

log('redirect_uri = ' + REDIRECT);
run(handleRedirect);
</script>
