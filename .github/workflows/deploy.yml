name: Deploy (Cloud Run)

# Builds the HTTP server image and rolls a Cloud Run revision. It never creates the service:
# its shape -- env, scaling, timeout, public access -- is Terraform's, `module "mcp"` in
# prompteye-vibe infra/gcp/envs/research, and the deployer identity holds `run.developer` on
# that one service only, so a deploy against a service Terraform has not made fails instead
# of inventing one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # research is the only environment with the module; envs/prod does not include it yet.
  ENVIRONMENT: research
  SUFFIX: RESEARCH
  PROJECT_ID: prompteye-analytics
  REGION: europe-central2
  SERVICE: mcp
  REPOSITORY: mcp

concurrency:
  group: mcp-deploy-research
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The deployer identity comes from the Terraform apply in prompteye-vibe. Until its
      # email is set here there is nothing to become, so say so instead of failing red.
      - name: Nothing to deploy to yet
        if: vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] == ''
        run: |
          {
            echo "## MCP — ${ENVIRONMENT}"
            echo
            echo 'No deploy: `GCP_MCP_DEPLOYER_'"${SUFFIX}"'` is not set.'
            echo 'Set it from `terraform output -raw mcp_deployer_service_account` in'
            echo 'prompteye-vibe infra/gcp/envs/'"${ENVIRONMENT}"'.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keyless, through the pool prompteye-vibe's bootstrap.sh created. The deployer can
      # write to one Artifact Registry repository, update one Cloud Run service and act as
      # one runtime identity.
      - name: Authenticate to Google Cloud
        if: vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', env.SUFFIX)] }}
          service_account: ${{ vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] }}

      - name: Setup gcloud
        if: vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        if: vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] != ''
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Tagged with the commit, so a revision names its source, and with `latest` for anyone
      # reaching for the newest by hand. The revision is deployed by the commit tag: a
      # rollback that follows a moving tag is not a rollback.
      - name: Build and push
        if: vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] != ''
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker build --tag "${image}:${GITHUB_SHA}" --tag "${image}:latest" .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

      # Only the image. Everything else about the service is Terraform's, and
      # `gcloud run deploy` leaves untouched what the command does not name.
      - name: Deploy the revision
        if: vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] != ''
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          gcloud run deploy "${SERVICE}" \
            --image="${image}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

      - name: Summary
        if: vars[format('GCP_MCP_DEPLOYER_{0}', env.SUFFIX)] != ''
        run: |
          url="$(gcloud run services describe "${SERVICE}" \
            --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.url)')"
          revision="$(gcloud run services describe "${SERVICE}" \
            --region="${REGION}" --project="${PROJECT_ID}" \
            --format='value(status.latestReadyRevisionName)')"
          {
            echo "## MCP — ${ENVIRONMENT}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Revision | \`${revision}\` |"
            echo "| Image | \`${GITHUB_SHA}\` |"
            echo "| URL | \`${url}/mcp\` |"
          } >> "$GITHUB_STEP_SUMMARY"
