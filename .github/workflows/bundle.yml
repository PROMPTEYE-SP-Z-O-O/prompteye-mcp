name: Bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run bundle

      - uses: actions/upload-artifact@v4
        with:
          name: prompteye-mcp
          path: build/prompteye-mcp.mcpb

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" build/prompteye-mcp.mcpb --generate-notes || gh release upload "$GITHUB_REF_NAME" build/prompteye-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
