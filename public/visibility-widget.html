<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PromptEye visibility</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #14161a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --ground: #ffffff;
        --panel: #f7f8fa;
        --accent: #4f46e5;
        --up: #15803d;
        --down: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f3f4f6;
          --muted: #9ca3af;
          --line: #2a2f3a;
          --ground: #12141a;
          --panel: #1a1d25;
          --accent: #8b87f5;
          --up: #4ade80;
          --down: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: var(--ground);
        color: var(--ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header { margin-bottom: 18px; }
      h1 { margin: 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { color: var(--muted); font-size: 12.5px; }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
      @media (max-width: 460px) { .tiles { grid-template-columns: 1fr; } }
      .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
      .tile .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; }
      .tile .value { font-size: 25px; font-weight: 600; letter-spacing: -0.02em; margin-top: 3px; }
      .tile .delta { font-size: 12px; margin-top: 1px; }
      .up { color: var(--up); }
      .down { color: var(--down); }
      .flat { color: var(--muted); }
      section { margin-top: 18px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
      svg { display: block; width: 100%; height: auto; overflow: visible; }
      .bars { display: grid; gap: 6px; }
      .bar-row { display: grid; grid-template-columns: minmax(72px, 26%) 1fr auto; gap: 10px; align-items: center; }
      .bar-name { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar-track { background: var(--panel); border-radius: 4px; height: 9px; overflow: hidden; }
      .bar-fill { background: var(--accent); height: 100%; border-radius: 4px; }
      .bar-value { font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 46px; text-align: right; }
      .empty { color: var(--muted); font-style: italic; padding: 14px 0; }
      footer { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
    </style>
  </head>
  <body>
    <div id="root"><p class="empty">Waiting for visibility data…</p></div>

    <script type="module">
      const root = document.getElementById("root");

      const esc = (value) =>
        String(value).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      const fmt = (value, suffix = "") => (value === null || value === undefined ? "—" : `${value}${suffix}`);

      // A rise in visibility is good; a rise in average position is a slide down the answer.
      function delta(value, suffix, higherIsBetter) {
        if (value === null || value === undefined) return '<div class="delta flat">no prior period</div>';
        const better = higherIsBetter ? value > 0 : value < 0;
        const cls = value === 0 ? "flat" : better ? "up" : "down";
        const sign = value > 0 ? "+" : "";
        return `<div class="delta ${cls}">${sign}${value}${suffix} vs previous period</div>`;
      }

      function tile(label, value, suffix, change, higherIsBetter) {
        return `<div class="tile">
          <div class="label">${esc(label)}</div>
          <div class="value">${esc(fmt(value, suffix))}</div>
          ${delta(change, suffix === "%" ? " pp" : "", higherIsBetter)}
        </div>`;
      }

      function trend(entries) {
        const points = entries.map((entry) => entry.metrics.visibility ?? 0);
        if (points.length < 2) return '<p class="empty">A trend needs at least two days in the period.</p>';

        const w = 640;
        const h = 150;
        const pad = 6;
        const max = Math.max(100, ...points);
        const x = (i) => (i / (points.length - 1)) * (w - pad * 2) + pad;
        const y = (v) => h - pad - (v / max) * (h - pad * 2);

        const line = points.map((v, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
        const area = `${line} L${x(points.length - 1).toFixed(1)},${h - pad} L${x(0).toFixed(1)},${h - pad} Z`;

        return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Visibility over time">
          <path d="${area}" fill="var(--accent)" opacity="0.12" />
          <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
                stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        <div class="sub" style="display:flex;justify-content:space-between;margin-top:4px">
          <span>${esc(entries[0].label)}</span><span>${esc(entries[entries.length - 1].label)}</span>
        </div>`;
      }

      function bars(entries) {
        const max = Math.max(1, ...entries.map((entry) => entry.metrics.visibility ?? 0));

        return `<div class="bars">${entries
          .map((entry) => {
            const value = entry.metrics.visibility ?? 0;
            return `<div class="bar-row">
              <div class="bar-name" title="${esc(entry.label)}">${esc(entry.label)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${(value / max) * 100}%"></div></div>
              <div class="bar-value">${esc(fmt(value, "%"))}</div>
            </div>`;
          })
          .join("")}</div>`;
      }

      function render(data) {
        if (!data || !data.totals) {
          root.innerHTML = '<p class="empty">No visibility data in this result.</p>';
          return;
        }

        const { totals, change, breakdown = [], by } = data;
        const traffic = data.aiTrafficTotal;

        const breakdownSection =
          breakdown.length === 0
            ? ""
            : `<section>
                 <h2>${by === "day" ? "Trend" : by === "model" ? "By assistant" : "By prompt"}</h2>
                 ${by === "day" ? trend(breakdown) : bars(breakdown)}
                 ${data.breakdownTruncated ? '<p class="sub">Truncated — ask for a higher limit to see more.</p>' : ""}
               </section>`;

        root.innerHTML = `
          <header>
            <h1>${esc(data.brand ?? "Visibility")}${data.projectName ? ` · ${esc(data.projectName)}` : ""}</h1>
            <div class="sub">${esc(data.startDate)} → ${esc(data.endDate)} ·
              ${esc((data.models ?? []).join(", ") || "no assistants")}</div>
          </header>
          <div class="tiles">
            ${tile("Visibility", totals.visibility, "%", change?.visibility, true)}
            ${tile("Reach index", totals.reachIndex, "", change?.reachIndex, true)}
            ${tile("Avg position", totals.averagePosition, "", change?.averagePosition, false)}
          </div>
          ${breakdownSection}
          <footer>${
            traffic === null || traffic === undefined
              ? "AI traffic not estimated"
              : `Estimated AI traffic: ${esc(traffic.toLocaleString())}`
          }</footer>`;

        reportSize();
      }

      /*
       * The MCP Apps handshake, spoken directly over postMessage.
       *
       * The ext-apps `App` class does this for us, but it is an npm module and
       * this widget ships as one self-contained HTML file with no build step —
       * so the four messages it needs are written out here:
       *   → ui/initialize (request)          ← host result
       *   → ui/notifications/initialized     ← ui/notifications/tool-result
       */
      const PROTOCOL_VERSION = "2026-01-26";
      let nextId = 1;

      const send = (message) => window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");

      function applyTheme(context) {
        if (context?.theme === "dark" || context?.theme === "light") {
          document.documentElement.setAttribute("data-theme", context.theme);
          document.documentElement.style.colorScheme = context.theme;
        }
      }

      let lastHeight = 0;
      function reportSize() {
        const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
        if (height === lastHeight) return;
        lastHeight = height;
        send({ method: "ui/notifications/size-changed", params: { width: Math.ceil(window.innerWidth), height } });
      }

      const initializeId = nextId++;

      window.addEventListener("message", (event) => {
        const message = event.data;
        if (message?.jsonrpc !== "2.0") return;

        if (message.id === initializeId && message.result) {
          applyTheme(message.result.hostContext);
          send({ method: "ui/notifications/initialized" });
          reportSize();
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          render(message.params?.structuredContent);
          return;
        }

        if (message.method === "ui/notifications/host-context-changed") {
          applyTheme(message.params);
          return;
        }

        // The host pings to check the app is alive; an unanswered ping tears it down.
        if (message.method === "ping" && message.id !== undefined) {
          send({ id: message.id, result: {} });
        }
      });

      send({
        id: initializeId,
        method: "ui/initialize",
        params: {
          appInfo: { name: "prompteye-visibility", version: "1.0.0" },
          appCapabilities: {},
          protocolVersion: PROTOCOL_VERSION,
        },
      });
    </script>
  </body>
</html>
